<!-- Avatar Selection System -->
<div style="margin:3rem 0; padding:2rem; background:rgba(99,102,241,.08); border:1px solid rgba(99,102,241,.2); border-radius:1rem;">
  <h3 style="text-align:center; margin-bottom:1.5rem;">Choose Your Avatar</h3>
  <p style="text-align:center; color:#a5b4fc; margin-bottom:1rem;">Select who represents you in Project Andromeda</p>
  
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:1rem;">
    <div id="avatar-remy" onclick="selectAvatar('remy')" style="cursor:pointer; padding:1rem; border-radius:.8rem; border:2px solid transparent; text-align:center; transition:all .2s;">
      <div style="font-size:2.5rem; margin-bottom:.5rem;">🤖</div>
      <div style="font-weight:600;">Remy</div>
      <div style="font-size:.8rem; color:#94a3b8;">System Guide</div>
    </div>
  </div>
</div>

<script>
function selectAvatar(name) {
  document.querySelectorAll('[id^="avatar-"]').forEach(el => {
    el.style.borderColor = 'transparent';
    el.style.background = 'transparent';
  });
  const selected = document.getElementById('avatar-' + name);
  selected.style.borderColor = '#6366f1';
  selected.style.background = 'rgba(99,102,241,.15)';
  localStorage.setItem('andromeda_avatar', name);
}
window.onload = function() {
  const saved = localStorage.getItem('andromeda_avatar');
  if (saved) selectAvatar(saved);
};
</script>

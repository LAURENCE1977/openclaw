<!-- Avatar Selection -->
<div style="margin: 2rem 0; padding: 0 1rem;">
  <h3 style="color:#a5b4fc; margin-bottom: 1.5rem; text-align: center;">Choose Your Guide</h3>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; max-width: 600px; margin: 0 auto;">
    
    <div id="avatar-remy" onclick="selectAvatar('remy')" style="cursor:pointer; padding: 1.25rem 0.75rem; border-radius: 0.8rem; border: 2px solid transparent; text-align:center; transition: all 0.2s ease; background: rgba(30,41,59,0.5);">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🦝</div>
      <div style="font-weight: 600; color: #e0e7ff;">Remy</div>
      <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">The Heart</div>
    </div>

    <div id="avatar-orion" onclick="selectAvatar('orion')" style="cursor:pointer; padding: 1.25rem 0.75rem; border-radius: 0.8rem; border: 2px solid transparent; text-align:center; transition: all 0.2s ease; background: rgba(30,41,59,0.5);">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">👨‍🚀</div>
      <div style="font-weight: 600; color: #e0e7ff;">Orion</div>
      <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">Explorer</div>
    </div>

    <div id="avatar-nova" onclick="selectAvatar('nova')" style="cursor:pointer; padding: 1.25rem 0.75rem; border-radius: 0.8rem; border: 2px solid transparent; text-align:center; transition: all 0.2s ease; background: rgba(30,41,59,0.5);">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">👩‍🔬</div>
      <div style="font-weight: 600; color: #e0e7ff;">Nova</div>
      <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">Innovator</div>
    </div>

  </div>
</div>

<script>
function selectAvatar(name) {
  ['remy','orion','nova'].forEach(id => {
    const el = document.getElementById('avatar-'+id);
    el.style.borderColor = 'transparent';
    el.style.background = 'rgba(30,41,59,0.5)';
  });
  const selected = document.getElementById('avatar-'+name);
  selected.style.borderColor = '#8b5cf6';
  selected.style.background = 'rgba(139,92,246,0.2)';
  localStorage.setItem('selectedAvatar', name);
}
window.onload = function() {
  const saved = localStorage.getItem('selectedAvatar');
  if(saved) selectAvatar(saved);
};
</script>

<!-- Avatar Selection -->
<div style="margin: 2rem 0;">
  <h3 style="color:#a5b4fc; margin-bottom:1rem;">Choose Your Guide</h3>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
    
    <div id="avatar-remy" onclick="selectAvatar('remy')" style="cursor:pointer; padding:1rem; border-radius:.8rem; border:2px solid transparent; text-align:center; transition:all .2s;">
      <div style="font-size:2.5rem; margin-bottom:.5rem;">🦝</div>
      <div style="font-weight:600;">Remy</div>
      <div style="font-size:.8rem; color:#94a3b8;">The Heart</div>
    </div>

    <div id="avatar-orion" onclick="selectAvatar('orion')" style="cursor:pointer; padding:1rem; border-radius:.8rem; border:2px solid transparent; text-align:center; transition:all .2s;">
      <div style="font-size:2.5rem; margin-bottom:.5rem;">👨‍🚀</div>
      <div style="font-weight:600;">Orion</div>
      <div style="font-size:.8rem; color:#94a3b8;">Explorer</div>
    </div>

    <div id="avatar-nova" onclick="selectAvatar('nova')" style="cursor:pointer; padding:1rem; border-radius:.8rem; border:2px solid transparent; text-align:center; transition:all .2s;">
      <div style="font-size:2.5rem; margin-bottom:.5rem;">👩‍🔬</div>
      <div style="font-weight:600;">Nova</div>
      <div style="font-size:.8rem; color:#94a3b8;">Innovator</div>
    </div>

  </div>
</div>

<script>
function selectAvatar(name) {
  // Clear all
  ['remy','orion','nova'].forEach(id => {
    document.getElementById('avatar-'+id).style.borderColor = 'transparent';
    document.getElementById('avatar-'+id).style.background = 'transparent';
  });
  // Highlight selected
  document.getElementById('avatar-'+name).style.borderColor = '#8b5cf6';
  document.getElementById('avatar-'+name).style.background = 'rgba(139,92,246,0.15)';
  // Save
  localStorage.setItem('selectedAvatar', name);
}
// Load saved on page open
window.onload = function() {
  const saved = localStorage.getItem('selectedAvatar');
  if(saved) selectAvatar(saved);
};
</script>

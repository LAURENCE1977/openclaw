<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw — Choose Your Guide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#121826;color:#e0e7ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
h1{color:#8ba4fc;margin-bottom:2rem;font-size:1.5rem}
.avatar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:600px;width:100%;margin-bottom:2rem}
.avatar-card{cursor:pointer;padding:1.5rem 1rem;border-radius:16px;border:3px solid transparent;background:rgba(30,41,59,0.5);transition:all .3s ease;text-align:center}
.avatar-card:hover{background:rgba(51,65,85,0.6);transform:translateY(-3px)}
.avatar-card.selected{border-color:#8b5cf6;background:rgba(139,92,246,0.15);box-shadow:0 0 20px rgba(139,92,246,0.35);transform:scale(1.03)}
.avatar-emoji{font-size:3rem;margin-bottom:.75rem}
.avatar-name{font-weight:600;font-size:1.1rem;color:#e0e7ff;margin-bottom:.3rem}
.avatar-role{font-size:.85rem;color:#94a3b8}
.chat-container{width:100%;max-width:600px;flex:1;display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;padding:1rem;margin-bottom:1rem;min-height:300px;max-height:500px;border-radius:12px;background:rgba(30,41,59,0.3)}
.message{margin-bottom:1rem;padding:.85rem 1.1rem;border-radius:14px;max-width:85%;line-height:1.5}
.message.user{background:#4f46e5;margin-left:auto;border-bottom-right-radius:4px}
.message.remy{background:rgba(234,179,8,0.15);border:1px solid rgba(234,179,8,0.3);margin-right:auto;border-bottom-left-radius:4px}
.message.orion{background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);margin-right:auto;border-bottom-left-radius:4px}
.message.nova{background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);margin-right:auto;border-bottom-left-radius:4px}
.message.typing{font-style:italic;opacity:.7}
.chat-input-row{display:flex;gap:.75rem}
#chat-input{flex:1;padding:.9rem 1.2rem;border-radius:12px;border:none;background:rgba(51,65,85,0.6);color:#e0e7ff;font-size:1rem}
#chat-input:focus{outline:2px solid #8b5cf6}
#send-btn{padding:.9rem 1.5rem;border-radius:12px;border:none;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:600;cursor:pointer;transition:transform .2s}
#send-btn:active{transform:scale(.97)}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<h1>Choose Your Guide</h1>
<div class="avatar-grid">
<div class="avatar-card" onclick="selectAvatar('remy')">
<div class="avatar-emoji">🦝</div>
<div class="avatar-name">Remy</div>
<div class="avatar-role">The Heart</div>
</div>
<div class="avatar-card" onclick="selectAvatar('orion')">
<div class="avatar-emoji">👨‍🚀</div>
<div class="avatar-name">Orion</div>
<div class="avatar-role">Explorer</div>
</div>
<div class="avatar-card" onclick="selectAvatar('nova')">
<div class="avatar-emoji">👩‍🔬</div>
<div class="avatar-name">Nova</div>
<div class="avatar-role">Innovator</div>
</div>
</div>
<div class="chat-container">
<div class="chat-messages" id="chat-messages"></div>
<div class="chat-input-row">
<input type="text" id="chat-input" placeholder="Ask your guide anything...">
<button id="send-btn">Send</button>
</div>
</div>

<script>
// ==================================================
// ↓↓↓ PASTE YOUR NEW KEY INSIDE THESE QUOTES ↓↓↓
const OPENROUTER_KEY = "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
";
const AI_MODEL = "meta-llama/llama-3.1-8b-instruct:free";
// ==================================================

const AVATARS = {
remy:{name:"Remy",emoji:"💛",system:"You are Remy — The Heart. Warm, gentle, deeply empathetic. Listen first, speak softly. Be supportive, patient, kind. Keep replies natural and conversational."},
orion:{name:"Orion",emoji:"🚀",system:"You are Orion — The Explorer. Curious, bold, visionary. Love discovery, big ideas, new possibilities. Be enthusiastic, open-minded, adventurous. Keep replies natural and conversational."},
nova:{name:"Nova",emoji:"✨",system:"You are Nova — The Innovator. Sharp, creative, practical, forward-thinking. Solve problems with fresh ideas. Be inspiring, clear, innovative. Keep replies natural and conversational."}
};

let selectedAvatar=null;
let conversationHistory=[];
let isTyping=false;

function selectAvatar(avatarId){
selectedAvatar=avatarId;
conversationHistory=[];
document.querySelectorAll('.avatar-card').forEach(c=>c.classList.remove('selected'));
event.currentTarget.classList.add('selected');
addMessage(AVATARS[avatarId].name,AVATARS[avatarId].emoji+" I'm "+AVATARS[avatarId].name+". How can I help you today?",avatarId);
}

function addMessage(sender,text,className=''){
const d=document.getElementById('chat-messages');
const m=document.createElement('div');
m.className='message '+(className||'');
m.textContent=text;
d.appendChild(m);
d.scrollTop=d.scrollHeight;
}

async function sendMessage(){
if(!selectedAvatar){addMessage('System','Please select a guide first.');return;}
const input=document.getElementById('chat-input');
const btn=document.getElementById('send-btn');
const text=input.value.trim();
if(!text||isTyping)return;

addMessage('You',text,'user');
input.value='';
isTyping=true;
btn.disabled=true;

const typing=addMessage(selectedAvatar,AVATARS[selectedAvatar].emoji+" typing...",'typing '+selectedAvatar);
conversationHistory.push({role:'user',content:text});

try{
const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{
method:'POST',
headers:{
'Authorization':`Bearer ${OPENROUTER_KEY}`,
'Content-Type':'application/json'
},
body:JSON.stringify({
model:AI_MODEL,
messages:[
{role:'system',content:AVATARS[selectedAvatar].system},
...conversationHistory
],
temperature:0.7
})
});

const data=await res.json();
document.querySelector('.message.typing')?.remove();
if(data.error)throw new Error(data.error.message);
const reply=data.choices[0].message.content.trim();
conversationHistory.push({role:'assistant',content:reply});
addMessage(selectedAvatar,reply,selectedAvatar);
}catch(err){
document.querySelector('.message.typing')?.remove();
addMessage('Error',`Sorry — ${err.message}`,'');
console.error(err);
}finally{
isTyping=false;
btn.disabled=false;
}
}

document.getElementById('send-btn').addEventListener('click',sendMessage);
document.getElementById('chat-input').addEventListener('keydown',e=>e.key==='Enter'&&sendMessage());
</script>
</body>
</html>

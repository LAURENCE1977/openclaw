<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw — Choose Your Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: #121826;
            color: #e0e7ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        h1 {
            color: #8ba4fc;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 1.5rem;
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            max-width: 600px;
            width: 100%;
            margin-bottom: 2rem;
        }
        .avatar-card {
            cursor: pointer;
            padding: 1.5rem 1rem;
            border-radius: 16px;
            border: 3px solid transparent;
            background: rgba(30, 41, 59, 0.5);
            transition: all 0.3s ease;
            text-align: center;
        }
        .avatar-card:hover {
            background: rgba(51, 65, 85, 0.6);
            transform: translateY(-3px);
        }
        .avatar-card.selected {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.15);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
            transform: scale(1.03);
        }
        .avatar-emoji { font-size: 3rem; margin-bottom: 0.75rem; }
        .avatar-name { font-weight: 600; font-size: 1.1rem; color: #e0e7ff; margin-bottom: 0.3rem; }
        .avatar-role { font-size: 0.85rem; color: #94a3b8; }

        .chat-container {
            width: 100%;
            max-width: 600px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            margin-bottom: 1rem;
            min-height: 200px;
            max-height: 400px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.3);
        }
        .message {
            margin-bottom: 1rem;
            padding: 0.85rem 1.1rem;
            border-radius: 14px;
            max-width: 85%;
            line-height: 1.5;
        }
        .message.user {
            background: #4f46e5;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message.remy { background: rgba(234, 179, 8, 0.15); border: 1px solid rgba(234, 179, 8, 0.3); margin-right: auto; border-bottom-left-radius: 4px; }
        .message.orion { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); margin-right: auto; border-bottom-left-radius: 4px; }
        .message.nova { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); margin-right: auto; border-bottom-left-radius: 4px; }
        
        .chat-input-row {
            display: flex;
            gap: 0.75rem;
        }
        #chat-input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            border: none;
            background: rgba(51, 65, 85, 0.6);
            color: #e0e7ff;
            font-size: 1rem;
        }
        #chat-input:focus { outline: 2px solid #8b5cf6; }
        #send-btn {
            padding: 0.9rem 1.5rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #send-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

<h1>Choose Your Guide</h1>

<div class="avatar-grid">
    <div id="avatar-remy" class="avatar-card" onclick="selectAvatar('remy')">
        <div class="avatar-emoji">🦝</div>
        <div class="avatar-name">Remy</div>
        <div class="avatar-role">The Heart</div>
    </div>
    <div id="avatar-orion" class="avatar-card" onclick="selectAvatar('orion')">
        <div class="avatar-emoji">👨‍🚀</div>
        <div class="avatar-name">Orion</div>
        <div class="avatar-role">Explorer</div>
    </div>
    <div id="avatar-nova" class="avatar-card" onclick="selectAvatar('nova')">
        <div class="avatar-emoji">👩‍🔬</div>
        <div class="avatar-name">Nova</div>
        <div class="avatar-role">Innovator</div>
    </div>
</div>

<div class="chat-container">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Ask your guide anything..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
const AVATARS = ['remy', 'orion', 'nova'];
let selectedAvatar = null;

const PERSONAS = {
    remy: {
        name: 'Remy',
        greeting: "Hi there 💛 I'm Remy — here to listen, support, and keep things warm and kind. How are you feeling today?",
        replyPrefix: "Remy 💛"
    },
    orion: {
        name: 'Orion',
        greeting: "Adventure awaits 🚀 I'm Orion — ready to explore, discover, and see where we can go together. What's on your mind?",
        replyPrefix: "Orion 🚀"
    },
    nova: {
        name: 'Nova',
        greeting: "Let's create something brilliant ✨ I'm Nova — ideas, innovation, and fresh perspectives. What shall we build or solve today?",
        replyPrefix: "Nova ✨"
    }
};

function selectAvatar(name) {
    AVATARS.forEach(id => document.getElementById(`avatar-${id}`).classList.remove('selected'));
    document.getElementById(`avatar-${name}`).classList.add('selected');
    selectedAvatar = name;
    localStorage.setItem('selectedAvatar', name);
    
    const messages = document.getElementById('chat-messages');
    messages.innerHTML = '';
    addMessage(PERSONAS[name].greeting, name);
}

function addMessage(text, sender) {
    const messages = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerHTML = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function getSimulatedReply(userText) {
    if (!selectedAvatar) return "Pick your guide first 👆";
    const p = PERSONAS[selectedAvatar];
    const lower = userText.toLowerCase();
    
    if (selectedAvatar === 'remy') {
        if (/hello|hi|hey/i.test(lower)) return `${p.replyPrefix}: Hello! 💛 So lovely to connect. How can I support you today?`;
        if (/tired|sad|down|hard/i.test(lower)) return `${p.replyPrefix}: I hear you, and I'm so sorry it feels heavy right now 💜 You're doing your absolute best — and that's more than enough. I'm right here.`;
        return `${p.replyPrefix}: That's such a thoughtful thing to ask 💛 Here's what I feel... kindness matters most. Take it one gentle step at a time — you've got this, and I've got you.`;
    }
    
    if (selectedAvatar === 'orion') {
        if (/hello|hi|hey/i.test(lower)) return `${p.replyPrefix}: Greetings, fellow explorer! 🚀 The stars are aligned — what shall we discover?`;
        if (/idea|dream|plan|future/i.test(lower)) return `${p.replyPrefix}: Big dreams! 🌌 That's exactly where every great journey begins. Map it out, take the first step — the horizon is waiting.`;
        return `${p.replyPrefix}: Interesting question! 🔭 Every answer leads to new questions. Let's look at it from every angle — what else comes to mind for you?`;
    }
    
    if (selectedAvatar === 'nova') {
        if (/hello|hi|hey/i.test(lower)) return `${p.replyPrefix}: Hello! ✨ Ready to innovate? Let's turn thoughts into something real.`;
        if (/create|build|make|design/i.test(lower)) return `${p.replyPrefix}: YES! 🧠 That's the energy. Start simple, iterate fast, keep what works, refine what doesn't. Progress > perfection. What's your first version?`;
        return `${p.replyPrefix}: Brilliant question! 💡 Let's break it down: start with the core idea, then build out. Simplicity is the ultimate sophistication. What's the smallest step we can take right now?`;
    }
}

function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    
    addMessage(text, 'user');
    input.value = '';
    
    setTimeout(() => {
        addMessage(getSimulatedReply(text), selectedAvatar);
    }, 600);
}

window.addEventListener('load', () => {
    const saved = localStorage.getItem('selectedAvatar');
    if (saved && AVATARS.includes(saved)) selectAvatar(saved);
});

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
